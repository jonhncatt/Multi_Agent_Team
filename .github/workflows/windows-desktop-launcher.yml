name: Windows Desktop Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "desktop/**"
      - "tests/test_desktop_launcher.py"
      - "tests/test_webview_host.py"
      - ".github/workflows/windows-desktop-launcher.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "tests/test_desktop_launcher.py"
      - "tests/test_webview_host.py"
      - ".github/workflows/windows-desktop-launcher.yml"

jobs:
  build-launcher:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: desktop/windows/requirements-build.txt

      - name: Install launcher build dependencies
        run: python -m pip install -r desktop/windows/requirements-build.txt

      - name: Test launcher core
        run: python -m pytest -q tests/test_desktop_launcher.py tests/test_webview_host.py

      - name: Build console-free executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --noconsole
          --icon desktop/windows/assets/vintage_programmer.ico
          --add-data "desktop/windows/assets/vintage_programmer.ico;desktop/windows/assets"
          --name VintageProgrammer
          desktop/launcher.py

      - name: Smoke-test executable configuration
        shell: pwsh
        run: |
          $env:VP_DESKTOP_BROWSER_PATH = "$env:WINDIR\System32\notepad.exe"
          dist\VintageProgrammer.exe --dry-run --probe-native-shell --project-root . --diagnostics-file launcher-diagnostics.json
          $diagnostics = Get-Content launcher-diagnostics.json | ConvertFrom-Json
          if ($diagnostics.app_url -ne "http://127.0.0.1:8080") {
            throw "Unexpected launcher URL: $($diagnostics.app_url)"
          }
          if (-not $diagnostics.native_shell_probe.available) {
            throw "Bundled WebView2 host is unavailable: $($diagnostics.native_shell_probe.reason)"
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: vintage-programmer-windows-launcher
          path: |
            dist/VintageProgrammer.exe
            desktop/windows/README.md
          if-no-files-found: error
          retention-days: 14
