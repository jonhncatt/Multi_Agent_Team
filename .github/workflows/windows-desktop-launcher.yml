name: Windows Desktop Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "desktop/**"
      - "tests/test_desktop_assets.py"
      - "tests/test_desktop_launcher.py"
      - ".github/workflows/windows-desktop-launcher.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "tests/test_desktop_assets.py"
      - "tests/test_desktop_launcher.py"
      - ".github/workflows/windows-desktop-launcher.yml"

jobs:
  build-launcher:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: desktop/windows/requirements-build.txt

      - name: Install launcher build dependencies
        run: python -m pip install -r desktop/windows/requirements-build.txt

      - name: Test launcher core
        run: python -m pytest -q tests/test_desktop_assets.py tests/test_desktop_launcher.py

      - name: Build console-free executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --noconsole
          --icon desktop/windows/assets/vintage_programmer.ico
          --add-data "desktop/windows/assets/vintage_programmer.ico;desktop/windows/assets"
          --name VintageProgrammer
          desktop/launcher.py

      - name: Smoke-test executable configuration
        shell: pwsh
        run: |
          $env:VP_DESKTOP_BROWSER_PATH = "$env:WINDIR\System32\notepad.exe"
          $diagnosticsPath = Join-Path $PWD "launcher-diagnostics.json"
          $launcher = Start-Process `
            -FilePath "dist\VintageProgrammer.exe" `
            -ArgumentList @(
              "--dry-run",
              "--project-root", $PWD.Path,
              "--diagnostics-file", $diagnosticsPath
            ) `
            -Wait `
            -PassThru
          if ($launcher.ExitCode -ne 0) {
            throw "Launcher diagnostics exited with code $($launcher.ExitCode)"
          }
          if (-not (Test-Path $diagnosticsPath)) {
            throw "Launcher diagnostics file was not created: $diagnosticsPath"
          }
          $diagnostics = Get-Content $diagnosticsPath | ConvertFrom-Json
          if ($diagnostics.app_url -ne "http://127.0.0.1:8080") {
            throw "Unexpected launcher URL: $($diagnostics.app_url)"
          }
          if (-not $diagnostics.browser_path) {
            throw "Packaged launcher did not resolve Google Chrome."
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: vintage-programmer-windows-launcher
          path: |
            dist/VintageProgrammer.exe
            desktop/windows/README.md
          if-no-files-found: error
          retention-days: 14
