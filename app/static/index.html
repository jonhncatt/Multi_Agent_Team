<!doctype html>
<html lang="ja-JP">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vintage Programmer</title>
    <link rel="icon" href="/static/assets/vintage_programmer.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/static/assets/vintage_programmer_64.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/static/assets/vintage_programmer_48.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/vintage_programmer_32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/vintage_programmer_16.png?v=3" />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("vp_desktop") !== "1") return;
        const fragment = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const fragmentToken = String(fragment.get("vp_control") || "");
        if (fragmentToken) window.sessionStorage.setItem("vp_desktop_control_token", fragmentToken);
        window.__VP_DESKTOP_HOST__ = String(params.get("vp_host") || "");
        window.__VP_DESKTOP_CONTROL_TOKEN__ = fragmentToken || String(
          window.sessionStorage.getItem("vp_desktop_control_token") || "",
        );
        if (fragmentToken) {
          window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
        }
        const requestedScale = Number.parseFloat(params.get("vp_scale") || "0.8");
        const scale = Number.isFinite(requestedScale)
          ? Math.min(1.25, Math.max(0.65, requestedScale))
          : 0.8;
        document.documentElement.dataset.vpDesktopShell = "true";
        document.documentElement.style.setProperty("--vp-desktop-ui-scale", String(scale));
        document.documentElement.style.setProperty(
          "--vp-desktop-viewport-height",
          `${100 / scale}vh`,
        );
      })();
    </script>
    <link rel="stylesheet" href="/static/styles.css?v=3.1.5Z" />
  </head>
  <body>
    <div id="root" data-app="vintage-programmer">
      <main class="app-boot-screen" role="status" aria-live="polite">
        <div class="app-boot-card">
          <img class="app-boot-mark" src="/static/assets/vintage_programmer.png" alt="" aria-hidden="true" />
          <div class="app-boot-copy">
            <div class="app-boot-title">Vintage Programmer</div>
            <div class="app-boot-status">
              <span class="app-boot-ring" aria-hidden="true"></span>
              <span>Loading workspace...</span>
            </div>
          </div>
        </div>
      </main>
    </div>
    <noscript>このページを使うには JavaScript を有効にしてください。</noscript>
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/static/vendor/htm.umd.js"></script>
    <script src="/static/vendor/marked.umd.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/locales.js?v=3.1.5Z" defer></script>
    <script src="/static/app.js?v=3.1.5Z" defer></script>
  </body>
</html>
