name = "summarizer"
description = "Read-only summarizer for distilling large supporting material."
tool_scope = "read_only"
allowed_tools = [
  "read_file",
  "list_dir",
  "glob_file_search",
  "search_contents_in_file",
  "search_contents_in_file_multi",
  "read_section",
